id var(--rule);\n  max-height: calc(100vh - 68px); overflow-y: auto;\n}\n.gnb.open > ul { padding: 0.5rem 1.5rem 1.5rem; }\n.gnb.open > ul > li { border-bottom: 1px solid var(--rule-soft); }\n.gnb.open > ul > li > a {\n  display: block; padding: 0.85rem 0.25rem; font-weight: 700; font-size: 0.98rem;\n}\n.gnb.open .sub { padding: 0 0 0.75rem; }\n.gnb.open .sub a {\n  display: block; padding: 0.4rem 1rem; font-size: 0.9rem; color: var(--muted);\n}\n.gnb.open .sub a:hover { color: var(--navy); }\n\n/* 데스크톱 */\n@media (min-width: 960px) {\n  .nav-toggle { display: none; }\n  .header-tel { display: inline-block; }\n  .gnb { display: block; margin-left: auto; position: static; }\n  .gnb > ul { display: flex; }\n  .gnb > ul > li { position: relative; border: none; }\n  .gnb > ul > li > a {\n    display: block; padding: 1.35rem 1rem; font-size: 0.94rem; font-weight: 600; color: var(--ink);\n    transition: color 160ms ease;\n  }\n  .gnb > ul > li > a:hover { color: var(--navy); }\n  .gnb > ul > li.active > a { color: var(--navy); box-shadow: inset 0 -2px 0 var(--bronze); }\n  .gnb .sub {\n    position: absolute; left: 50%; transform: translateX(-50%); top: 100%;\n    min-width: 190px; padding: 0.5rem 0;\n    background: var(--surface); border: 1px solid var(--rule); border-top: 2px solid var(--navy);\n    box-shadow: 0 10px 24px rgba(11,36,64,0.08);\n    opacity: 0; visibility: hidden; transition: opacity 160ms ease, visibility 160ms ease;\n  }\n  .gnb > ul > li:hover .sub,\n  .gnb > ul > li:focus-within .sub { opacity: 1; visibility: visible; }\n  .gnb .sub a {\n    display: block; padding: 0.55rem 1.2rem; font-size: 0.88rem; color: var(--ink);\n    white-space: nowrap; transition: background 140ms ease, color 140ms ease;\n  }\n  .gnb .sub a:hover { background: var(--shade); color: var(--navy); }\n}\n\n/* ---------- page hero (서브페이지 상단) ---------- */\n.page-hero {\n  background: var(--navy-deep); color: #F2F5F9;\n  border-bottom: 3px solid var(--bronze);\n  padding: clamp( gin: 0; font-size: 1.16rem; font-weight: 700; letter-spacing: -0.02em; }\n.pro-body .cert { font-size: 0.85rem; font-weight: 500; color: var(--navy); }\n.pro-body .field { font-size: 0.8rem; line-height: 1.7; color: var(--muted); margin-top: 0.35rem; }\n\n/* 프로필 상세 */\n.profile-layout { display: grid; gap: 2.5rem; grid-template-columns: 1fr; }\n@media (min-width: 900px) { .profile-layout { grid-template-columns: 340px 1fr; gap: 4rem; } }\n.profile-side { display: flex; flex-direction: column; gap: 1.2rem; }\n.profile-side .pro-photo { border: 1px solid var(--rule); }\n.profile-side .id { border-top: 2px solid var(--navy); padding-top: 1rem; }\n.profile-side .id h1 { margin: 0; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.025em; }\n.profile-side .id .cert { color: var(--navy); font-weight: 600; margin-top: 0.2rem; }\n.profile-main h2 {\n  margin: 0 0 1rem; font-size: 1.05rem; font-weight: 700; color: var(--navy);\n  padding-bottom: 0.6rem; border-bottom: 1px solid var(--rule);\n}\n.profile-main section, .profile-block { padding: 0 0 2.5rem; border: none; }\n.hist-list { list-style: none; margin: 0; padding: 0; }\n.hist-list li { padding: 0.42rem 0 0.42rem 1.1rem; position: relative; font-size: 0.95rem; }\n.hist-list li::before {\n  content: \"\"; position: absolute; left: 0; top: 1.05em;\n  width: 5px; height: 5px; background: var(--bronze);\n}\n.tag-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }\n.tag {\n  font-size: 0.82rem; font-weight: 600; color: var(--navy);\n  border: 1px solid var(--rule); background: var(--shade); padding: 0.3rem 0.8rem;\n}\n\n/* ---------- 연혁 타임라인 ---------- */\n.timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--rule); }\n.timeline li { position: relative; padding: 0 0 1.6rem 1.8rem; }\n.timeline li::before {\n  content: \"\"; position: absolute; left: -6px; top: 0.5em;\n  width: 10px; height: 10px; background: var(--surface); border: 2px solid var(--bronze);\n  border-radius: 50%;\n}\n.timeli .wrap { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }\n\n/* ---------- header ---------- */\n.site-header {\n  position: sticky; top: 0; z-index: 50;\n  background: rgba(255,255,255,0.97);\n  backdrop-filter: blur(8px);\n  border-bottom: 1px solid var(--rule);\n}\n.header-inner { display: flex; align-items: center; gap: 1.25rem; height: 68px; }\n.logo { display: flex; align-items: baseline; gap: 0.5rem; text-decoration: none; flex: none; }\n.logo .ko { font-weight: 800; font-size: 1.12rem; letter-spacing: -0.02em; color: var(--navy); }\n.logo .en { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.13em; color: var(--muted); text-transform: uppercase; }\n\n.nav-toggle {\n  margin-left: auto; display: inline-flex; flex-direction: column; justify-content: center; gap: 5px;\n  width: 44px; height: 44px; padding: 0 10px;\n  background: none; border: 1px solid var(--rule); cursor: pointer;\n}\n.nav-toggle span { display: block; height: 2px; background: var(--navy); }\n\n.gnb { display: none; }\n.gnb ul { list-style: none; margin: 0; padding: 0; }\n.gnb a { text-decoration: none; }\n\n.header-tel {\n  display: none; text-decoration: none; flex: none;\n  font-family: var(--mono); font-size: 0.86rem; font-weight: 500; color: var(--navy);\n  border: 1px solid var(--navy); padding: 0.4rem 0.9rem;\n  transition: background 160ms ease, color 160ms ease;\n}\n.header-tel:hover { background: var(--navy); color: #fff; }\n\n/* 모바일 패널 */\n.gnb.open {\n  display: block;\n  position: absolute; left: 0; right: 0; top: 68px;\n  background: var(--surface); border-bottom: 1px solid var(--rule);\n  max-height: calc(100vh - 68px); overflow-y: auto;\n}\n.gnb.open > ul { padding: 0.5rem 1.5rem 1.5rem; }\n.gnb.open > ul > li { border-bottom: 1px solid var(--rule-soft); }\n.gnb.open > ul > li > a {\n  display: block; padding: 0.85rem 0.25rem; font-weight: 700; font-size: 0.98rem;\n}\n.gnb.open .sub { padding: 0 0 0.75rem; }\n.gnb.open .sub a {\n  display: block; padding: 0.4rem 1rem; font-size: 0.9rem; color: var(--muted);\n}\n.gnb.open .sub a:hover { color: var(--navy); }\n\n/* 데스크톱 */\n@media (min-width: 960px) {\n  .nav-toggle { display: none; }\n  .header-tel { display: inline-block; }\n  .gnb { display: block; margin-left: auto; position: static; }\n  .gnb > ul { display: flex; }\n  .gnb > ul > li { position: relative; border: none; }\n  .gnb > ul > li > a {\n    display: block; padding: 1.35rem 1rem; font-size: 0.94rem; font-weight: 600; color: var(--ink);\n    transition: color 160ms ease;\n  }\n  .gnb > ul > li > a:hover { color: var(--navy); }\n  .gnb > ul > li.active > a { color: var(--navy); box-shadow: inset 0 -2px 0 var(--bronze); }\n  .gnb .sub {\n    position: absolute; left: 50%; transform: translateX(-50%); top: 100%;\n    min-width: 190px; padding: 0.5rem 0;\n    background: var(--surface); border: 1px solid var(--rule); border-top: 2px solid var(--navy);\n    box-shadow: 0 10px 24px rgba(11,36,64,0.08);\n    opacity: 0; visibility: hidden; transition: opacity 160ms ease, visibility 160ms ease;\n  }\n  .gnb > ul > li:hover .sub,\n  .gnb > ul > li:focus-within .sub { opacity: 1; visibility: visible; }\n  .gnb .sub a {\n    display: block; padding: 0.55rem 1.2rem; font-size: 0.88rem; color: var(--ink);\n    white-space: nowrap; transition: background 140ms ease, color 140ms ease;\n  }\n  .gnb .sub a:hover { background: var(--shade); color: var(--navy); }\n}\n\n/* ---------- page hero (서브페이지 상단) ---------- */\n.page-hero {\n  background: var(--navy-deep); color: #F2F5F9;\n  border-bottom: 3px solid var(--bronze);\n  padding: clamp(3rem, 8vw, 5rem) 0 clamp(2.2rem, 6vw, 3.5rem);\n}\n.page-hero .eyebrow {\n  font-family: var(--mono); font-size: 0.7rem; font-weight: 500;\n  letter-spacing: 0.2em; text-transform: uppercase; color: var(--bronze-soft); margin: 0 0 1rem;\n}\n.page-hero h1 {\n  margin: 0; font-weight: 800; letter-spacing: -0.03em;\n  font-size: clamp(1.7rem, 4.5vw, 2.6rem); line-height: 1.25; text-wrap: balance;\n}\n.page-hero .lede { margin: 1.1rem 0 0; max-width: 56ch; color: #AEBCCC; font-weight: 300; }\n.breadcrumb {\n  margin: 2rem 0 0; display: flex; flex-wrap: wrap; gap: 0.4rem;\n  font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.05em; color: #8FA1B5;\n}\n.breadcrumb a { color: #B8C4D2; text-decoration: none; }\n.breadcrumb a:hover { color: #fff; }\n.breadcrumb .sep { color: #5F7288; }\n\n/* ---------- main hero (메인 전용) ---------- */\n.hero { background: var(--navy-deep); color: #F2F5F9; border-bottom: 3px solid var(--bronze); }\n.hero-inner { padding: clamp(4.5rem, 12vw, 8rem) 0 clamp(3.5rem, 9vw, 6rem); }\n.hero .eyebrow {\n  font-family: var(--mono); font-size: 0.72rem; font-weight: 500;\n  letter-spacing: 0.2em; text-transform: uppercase; color: var(--bronze-soft); margin: 0 0 1.4rem;\n}\n.hero h1 {\n  margin: 0 0 1.4rem; font-weight: 800;\n  font-size: clamp(2rem, 5.5vw, 3.3rem); line-height: 1.26; letter-spacing: -0.03em;\n  text-wrap: balance; max-width: 20ch;\n}\n.hero h1 em { font-style: normal; color: var(--bronze-soft); }\n.hero p { margin: 0 0 2.4rem; max-width: 48ch; color: #AEBCCC; font-size: 1.04rem; font-weight: 300; }\n.hero-cta { display: flex; flex-wrap: wrap; gap: 0.75rem; }\n\n.btn {\n  display: inline-block; text-decoration: none; font-weight: 600; font-size: 0.95rem;\n  padding: 0.85rem 1.7rem; transition: opacity 160ms ease, background 160ms ease, color 160ms ease;\n}\n.btn-primary { background: var(--bronze-soft); color: #14243A; }\n.btn-primary:hover { opacity: 0.88; }\n.btn-ghost { border: 1px solid rgba(255,255,255,0.35); color: #E8EEF5; }\n.btn-ghost:hover { background: rgba(255,255,255,0.08); }\n.btn-navy { background: var(--navy); color: #fff; }\n.btn-navy:hover { background: var(--navy-deep); }\n\n/* ---------- 공통 섹션 ---------- */\nsection { padding: clamp(4rem, 10vw, 6.5rem) 0; }\nsection + section { border-top: 1px solid var(--rule); }\n.sec-head { margin-bottom: clamp(2rem, 5vw, 3.2rem); }\n.sec-label {\n  font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.18em;\n  text-transform: uppercase; color: var(--bronze); margin: 0 0 0.8rem;\n}\n.sec-head h2 {\n  margin: 0; font-weight: 700; letter-spacing: -0.025em;\n  font-size: clamp(1.5rem, 3.6vw, 2.1rem); line-height: 1.35; text-wrap: balance;\n}\n.sec-head p { margin: 1rem 0 0; max-width: 62ch; color: var(--muted); }\n.bg-surface { background: var(--surface); }\n\n/* ---------- 통계 스트립 ---------- */\n.stat-grid { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); grid-template-columns: 1fr; }\n@media (min-width: 640px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }\n@media (min-width: 1024px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }\n.stat { background: var(--surface); padding: 1.7rem 1.5rem; }\n.stat .k { display: block; font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; color: var(--navy); }\n.stat .v { display: block; margin-top: 0.3rem; font-size: 0.85rem; color: var(--muted); }\n\n/* ---------- 카드 그리드 ---------- */\n.card-grid { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); grid-template-columns: 1fr; }\n@media (min-width: 700px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }\n@media (min-width: 1024px) { .card-grid.cols-4 { grid-template-columns: repeat(4, 1fr); } .card-grid.cols-3 { grid-template-columns: repeat(3, 1fr); } }\n.card {\n  background: var(--surface); padding: 1.8rem 1.5rem 2rem;\n  display: flex; flex-direction: column; gap: 0.7rem;\n  text-decoration: none; transition: background 160ms ease;\n}\na.card:hover { background: var(--shade); }\n.card .num { font-family: var(--mono); font-size: 0.72rem; color: var(--bronze); }\n.card h3 { margin: 0; font-size: 1.08rem; font-weight: 700; letter-spacing: -0.015em; }\n.card p { margin: 0; font-size: 0.87rem; line-height: 1.65; color: var(--muted); flex: 1; }\n.card .more { font-size: 0.8rem; font-weight: 600; color: var(--navy); }\n\n/* ---------- 서비스 목록 페이지 ---------- */\n.svc-intro { font-size: 1.02rem; max-width: 68ch; }\n.svc-list { list-style: none; margin: 2rem 0 0; padding: 0; display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }\n@media (min-width: 768px) { .svc-list { grid-template-columns: repeat(2, 1fr); } }\n.svc-list li {\n  background: var(--surface); padding: 1.05rem 1.4rem;\n  display: flex; gap: 0.8rem; align-items: baseline; font-size: 0.95rem;\n}\n.svc-list li::before { content: \"\"; flex: none; width: 6px; height: 6px; background: var(--bronze); margin-top: 2px; align-self: center; }\n\n/* ---------- 전문인력 ---------- */\n.pro-grid { display: grid; gap: 1.5rem; grid-template-columns: 1fr; }\n@media (min-width: 640px) { .pro-grid { grid-template-columns: repeat(2, 1fr); } }\n@media (min-width: 1024px) { .pro-grid { grid-template-columns: repeat(4, 1fr); } }\n.pro-card {\n  border: 1px solid var(--rule); background: var(--surface);\n  display: flex; flex-direction: column; text-decoration: none;\n  transition: border-color 160ms ease;\n}\na.pro-card:hover { border-color: var(--navy); }\n.pro-photo {\n  aspect-ratio: 4 / 5; background: var(--shade);\n  display: flex; align-items: center; justify-content: center;\n  border-bottom: 1px solid var(--rule);\n}\n.pro-photo svg { width: 84px; height: 84px; color: #B9C3CF; }\n.pro-body { padding: 1.3rem 1.4rem 1.5rem; display: flex; flex-direction: column; gap: 0.3rem; }\n.pro-body .position { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bronze); }\n.pro-body h3 { margin: 0; font-size: 1.16rem; font-weight: 700; letter-spacing: -0.02em; }\n.pro-body .cert { font-size: 0.85rem; font-weight: 500; color: var(--navy); }\n.pro-body .field { font-size: 0.8rem; line-height: 1.7; color: var(--muted); margin-top: 0.35rem; }\n\n/* 프로필 상세 */\n.profile-layout { display: grid; gap: 2.5rem; grid-template-columns: 1fr; }\n@media (min-width: 900px) { .profile-layout { gri <script>
(function () {
  var PAGES = JSON.parse(document.getElementById('pages').textContent);
  var view = document.getElementById('view');
  var addr = document.getElementById('addr');
  var hist = [];
  var current = 'index.html';

  function resolve(href, base) {
    try { return new URL(href, 'http://x/' + base).pathname.slice(1); }
    catch (e) { return null; }
  }

  function nav(path, push) {
    if (!(path in PAGES)) return false;
    if (push && current) hist.push(current);
    current = path;
    addr.textContent = path;
    view.srcdoc = PAGES[path];
    return true;
  }

  view.addEventListener('load', function () {
    var doc = view.contentDocument;
    if (!doc) return;
    doc.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a');
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (!href || href.startsWith('#')) return;
      if (/^(tel:|mailto:)/.test(href)) return;                 // 기본 동작
      if (/^https?:/.test(href)) { e.preventDefault(); window.open(href, '_blank'); return; }
      e.preventDefault();
      var t = resolve(href, current);
      if (t && nav(t, true)) doc.defaultView.scrollTo(0, 0);
    }, true);
  });

  document.getElementById('back').addEventListener('click', function () {
    var p = hist.pop(); if (p) nav(p, false);
  });
  document.getElementById('home').addEventListener('click', function () {
    hist.push(current); nav('index.html', false);
  });

  nav('index.html', false);
})();
</script>
